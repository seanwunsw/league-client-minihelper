name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Build executable
      run: |
        pyinstaller build.spec
    
    - name: Verify executable exists
      run: |
        if (Test-Path "dist\LoLAutoAccept.exe") {
          Write-Host "Executable built successfully"
          Get-Item "dist\LoLAutoAccept.exe" | Format-List
        } else {
          Write-Error "Executable not found!"
          exit 1
        }
      shell: powershell
    
    - name: Get version from tag
      id: get_version
      run: |
        if ("${{ github.ref }}" -match "refs/tags/(.*)") {
          $version = $matches[1]
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
        } else {
          $version = "dev"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version (no tag)"
        }
      shell: powershell
    
    - name: Package release
      run: |
        $version = "${{ steps.get_version.outputs.VERSION }}"
        $zipName = "LoLAutoAccept-$version-win64.zip"
        
        Write-Host "Creating release package: $zipName"
        
        # Create package directory
        New-Item -ItemType Directory -Force -Path "package"
        
        # Copy exe and README
        Copy-Item "dist\LoLAutoAccept.exe" -Destination "package\"
        Copy-Item "dist_README.txt" -Destination "package\README.txt"
        
        # Create ZIP
        Compress-Archive -Path "package\*" -DestinationPath $zipName
        
        # Show contents and size
        Write-Host "`nZIP contents:"
        $zipInfo = Get-Item $zipName
        Write-Host "  Size: $([math]::Round($zipInfo.Length / 1MB, 2)) MB"
        
        Write-Host "`nFiles in ZIP:"
        $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipName).Path)
        $zip.Entries | ForEach-Object { Write-Host "  - $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
        $zip.Dispose()
      shell: powershell
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LoLAutoAccept-${{ steps.get_version.outputs.VERSION }}-win64
        path: LoLAutoAccept-${{ steps.get_version.outputs.VERSION }}-win64.zip
        retention-days: 5
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: LoLAutoAccept-${{ steps.get_version.outputs.VERSION }}-win64.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
