name: PR Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Build executable
      run: |
        pip install pyinstaller
        pyinstaller build.spec
    
    - name: Get executable size
      id: exe_size
      shell: pwsh
      run: |
        $size = (Get-Item dist/LoLAutoAccept.exe).Length
        $sizeMB = [math]::Round($size / 1MB, 2)
        echo "SIZE_BYTES=$size" >> $env:GITHUB_OUTPUT
        echo "SIZE_MB=$sizeMB" >> $env:GITHUB_OUTPUT
        echo "Executable size: $sizeMB MB ($size bytes)"
    
    - name: Smoke test - Launch built exe
      timeout-minutes: 2
      shell: pwsh
      run: |
        # Define Win32 API wrapper for window detection
        $code = @'
        using System;
        using System.Runtime.InteropServices;
        public class Win32 {
          [DllImport("user32.dll", CharSet = CharSet.Auto)]
          public static extern IntPtr FindWindow(string lpClassName, string lpWindowName);
          
          [DllImport("user32.dll")]
          public static extern bool IsWindow(IntPtr hWnd);
        }
        '@
        Add-Type -TypeDefinition $code
        
        # Check what files exist before launch
        Write-Host "Files in dist:"
        Get-ChildItem dist | Select-Object Name
        
        # Launch the exe and redirect output
        Write-Host "`nLaunching exe..."
        $process = Start-Process -FilePath "dist\LoLAutoAccept.exe" -WorkingDirectory "dist" -PassThru -RedirectStandardOutput "dist\stdout.txt" -RedirectStandardError "dist\stderr.txt" -NoNewWindow
        
        Write-Host "Launched exe with PID $($process.Id), waiting for startup logs..."
        
        # Wait up to 30 seconds for log file to appear and contain startup messages
        $timeout = 30
        $elapsed = 0
        $logFile = "dist\LoLAutoAccept.log"
        $windowCheckDone = $false
        
        while ($elapsed -lt $timeout) {
          Start-Sleep -Seconds 1
          $elapsed++
          
          # Check if process exited
          if ($process.HasExited) {
            Write-Host "ERROR: Process exited with code $($process.ExitCode) after $elapsed seconds"
            break
          }
          
          if (Test-Path $logFile) {
            $content = Get-Content $logFile -Raw
            
            # Check for required startup log lines
            if ($content -match "=== LoL Auto-Accept Helper v0.2.0") {
              if ($elapsed -eq 1) {
                Write-Host "  [OK] Startup message"
              }
              
              if ($content -match "Controller created") {
                if ($elapsed -eq 1) {
                  Write-Host "  [OK] Controller created"
                }
                
                if ($content -match "Controller started") {
                  if ($elapsed -eq 1) {
                    Write-Host "  [OK] Controller started"
                  }
                  
                  if ($content -match "Tray thread started") {
                    if ($elapsed -eq 1) {
                      Write-Host "  [OK] Tray thread started"
                    }
                    
                    if ($content -match "Webview ready") {
                      if (-not $windowCheckDone) {
                        Write-Host "  [OK] Webview ready"
                        
                        # Try to find the window (wait a moment for it to be created)
                        Start-Sleep -Milliseconds 500
                        $hwnd = [Win32]::FindWindow($null, "LoL Auto-Accept Helper")
                        
                        if ($hwnd -ne [IntPtr]::Zero -and [Win32]::IsWindow($hwnd)) {
                          Write-Host "  [OK] Window found: hwnd=$hwnd"
                          $windowCheckDone = $true
                        } else {
                          Write-Host "  [INFO] Window not found by title (may be start_minimized or hidden keeper)"
                          $windowCheckDone = $true
                        }
                      }
                      
                      # Success: all key log lines present
                      Write-Host "`nSUCCESS: App started successfully in $elapsed seconds"
                      Stop-Process -Id $process.Id -Force
                      exit 0
                    }
                  }
                }
              }
            }
          }
        }
        
        # Timeout or exit - print all available info
        Write-Host "`nFAILED: App did not start within $timeout seconds"
        
        Write-Host "`nFiles in dist after launch:"
        Get-ChildItem dist | Select-Object Name
        
        if (Test-Path $logFile) {
          Write-Host "`n=== LoLAutoAccept.log ==="
          Get-Content $logFile
        } else {
          Write-Host "`nNo LoLAutoAccept.log found"
        }
        
        if (Test-Path "dist\emergency.log") {
          Write-Host "`n=== emergency.log ==="
          Get-Content "dist\emergency.log"
        }
        
        if (Test-Path "dist\stdout.txt") {
          Write-Host "`n=== stdout.txt ==="
          Get-Content "dist\stdout.txt"
        }
        
        if (Test-Path "dist\stderr.txt") {
          Write-Host "`n=== stderr.txt ==="
          Get-Content "dist\stderr.txt"
        }
        
        Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
        exit 1
    
    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: LoLAutoAccept-PR-${{ github.event.pull_request.number }}
        path: dist/LoLAutoAccept.exe
        retention-days: 14
    
    - name: Generate screenshots
      run: |
        python scripts/generate_screenshots.py
    
    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      with:
        name: UI-Screenshots-PR-${{ github.event.pull_request.number }}
        path: screenshots/*.png
        retention-days: 14
    
    - name: Comment exe size on PR
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `### 📦 Build Successful\n\n**Executable size:** ${{ steps.exe_size.outputs.SIZE_MB }} MB (${{ steps.exe_size.outputs.SIZE_BYTES }} bytes)\n\n**Artifacts:**\n- [LoLAutoAccept.exe](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n- [UI Screenshots](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`
          })
