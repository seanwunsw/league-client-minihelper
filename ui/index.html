<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Auto-Accept</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="combobox.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="title-group">
                <h1>⚔️ LoL Helper</h1>
                <button type="button" id="settings-button" class="icon-button" title="Settings" aria-label="Settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-panel">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                        <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.2 7.2 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.22-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.88a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.23.4.32.64.22l2.39-.96c.5.4 1.05.72 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.58-.22 1.12-.54 1.63-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
                    </svg>
                </button>
            </div>
            <div class="connection-status" id="connection-status">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Disconnected</span>
            </div>
        </header>
        
        <section class="gameflow">
            <div class="phase-display" id="gameflow-phase">No Active Session</div>
        </section>
        
        <div class="features-container">
            <section class="feature-section">
                <h2>Auto-Accept Ready Check</h2>
                <div class="toggle-container">
                    <label class="toggle">
                        <input type="checkbox" id="auto-accept-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                    <span>Enabled</span>
                </div>
                
                <div class="setting-group">
                    <label>Random Delay Range (seconds)</label>
                    <div class="range-inputs">
                        <input type="number" id="delay-min" min="0" max="10" step="0.1" value="1">
                        <span>to</span>
                        <input type="number" id="delay-max" min="0" max="10" step="0.1" value="4">
                    </div>
                </div>
            </section>
            
            <section class="feature-section">
                <h2>Champion Select</h2>
                <div class="warning-banner">
                    ⚠️ Warning: Auto-ban/pick may violate Riot's Terms of Service. Use at your own risk.
                </div>
                
                <div class="toggle-container">
                    <label class="toggle">
                        <input type="checkbox" id="auto-ban-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                    <span>Auto-Ban</span>
                </div>
                
                <div class="setting-group">
                    <label>Ban delay (seconds)</label>
                    <div class="range-inputs">
                        <input type="number" id="ban-delay-min" min="0" max="30" step="0.1" value="1">
                        <span>to</span>
                        <input type="number" id="ban-delay-max" min="0" max="30" step="0.1" value="3">
                    </div>
                </div>
                
                <div class="toggle-container">
                    <label class="toggle">
                        <input type="checkbox" id="auto-pick-toggle">
                        <span class="toggle-slider"></span>
                    </label>
                    <span>Auto-Pick</span>
                    <select id="pick-mode">
                        <option value="hover">Hover</option>
                        <option value="lock">Lock</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label>Pick delay (seconds)</label>
                    <div class="range-inputs">
                        <input type="number" id="pick-delay-min" min="0" max="30" step="0.1" value="1">
                        <span>to</span>
                        <input type="number" id="pick-delay-max" min="0" max="30" step="0.1" value="3">
                    </div>
                </div>
                
                <div class="role-tabs">
                    <button class="role-tab active" data-role="default">Default</button>
                    <button class="role-tab" data-role="top">Top</button>
                    <button class="role-tab" data-role="jungle">Jungle</button>
                    <button class="role-tab" data-role="middle">Mid</button>
                    <button class="role-tab" data-role="bottom">Bot</button>
                    <button class="role-tab" data-role="utility">Sup</button>
                </div>
                
                <div id="role-content" class="role-content">
                    <div class="champ-lists">
                        <div class="champ-list">
                            <h3>Bans (Priority)</h3>
                            <div class="combobox-container" data-type="ban" data-priority="1"></div>
                            <div class="combobox-container" data-type="ban" data-priority="2"></div>
                            <div class="combobox-container" data-type="ban" data-priority="3"></div>
                        </div>
                        <div class="champ-list">
                            <h3>Picks (Priority)</h3>
                            <div class="combobox-container" data-type="pick" data-priority="1"></div>
                            <div class="combobox-container" data-type="pick" data-priority="2"></div>
                            <div class="combobox-container" data-type="pick" data-priority="3"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        
        <section class="log-section">
            <h3>Log <button id="clear-log">Clear</button></h3>
            <div id="log-view" class="log-view"></div>
        </section>
    </div>

    <div id="settings-panel" class="settings-panel" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <div class="settings-card">
            <div class="settings-header">
                <h2 id="settings-title">Settings</h2>
                <button type="button" id="settings-close" class="icon-button" aria-label="Close settings">✕</button>
            </div>
            <fieldset class="settings-fieldset">
                <legend>When closing the window</legend>
                <label class="settings-option">
                    <input type="radio" name="close-action" id="close-action-exit" value="exit" checked>
                    <span>Exit app</span>
                </label>
                <label class="settings-option">
                    <input type="radio" name="close-action" id="close-action-tray" value="tray">
                    <span>Minimise to tray</span>
                </label>
            </fieldset>
            <label class="settings-check" id="start-with-windows-label">
                <input type="checkbox" id="start-with-windows">
                <span>Start with Windows (minimised to tray)</span>
            </label>
            <p id="startup-note" class="settings-note" hidden></p>
        </div>
    </div>
    <script src="combobox.js"></script>
    <script src="app.js"></script>
</body>
</html>
